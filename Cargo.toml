[package]
name = "xyzcadrs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Functional/implicit CAD in Rust: render f(x,y,z) material fields to watertight 3D-printable STL and colored OBJ — a Rust port of xyzcad"
authors = ["Stefan Helmert <stefan.helmert@t-online.de>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/TheTesla/xyzcadrs"
homepage = "https://github.com/TheTesla/xyzcadrs"
readme = "README.md"
keywords = ["cad", "stl", "3d-printing", "marching-cubes", "implicit-surfaces"]
categories = ["graphics", "rendering", "science"]

[dependencies]
thiserror = "2"
rayon = "1.10"

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "xyzcadrs"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
lto = "thin"
codegen-units = 1
